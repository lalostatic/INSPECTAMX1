<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" width="1240" height="360">
  <rect width="1240" height="360" fill="#ffffff"/>
  <text x="20" y="28" fill="#0e2433" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">CHASIS · VISTA SUPERIOR (PLANTA)</text>
  <!-- gooseneck left -->
  <path d="M60 100 L60 260 L140 260 L140 220 L200 220 L200 140 L140 140 L140 100 Z" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <!-- main rails -->
  <rect x="200" y="120" width="880" height="20" fill="none" stroke="#0e2433" stroke-width="2"/>
  <rect x="200" y="220" width="880" height="20" fill="none" stroke="#0e2433" stroke-width="2"/>
  <!-- cross members -->
  <line x1="280" y1="120" x2="280" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="380" y1="120" x2="380" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="480" y1="120" x2="480" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="580" y1="120" x2="580" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="680" y1="120" x2="680" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="780" y1="120" x2="780" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="880" y1="120" x2="880" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="980" y1="120" x2="980" y2="240" stroke="#0e2433" stroke-width="1.5"/>
  <!-- landing gear mechanism -->
  <rect x="360" y="155" width="50" height="50" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <line x1="385" y1="205" x2="385" y2="280" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="370" y1="280" x2="400" y2="280" stroke="#0e2433" stroke-width="1.5"/>
  <!-- bogie wheels top -->
  <rect x="900" y="70" width="70" height="40" rx="4" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="980" y="70" width="70" height="40" rx="4" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="900" y="250" width="70" height="40" rx="4" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="980" y="250" width="70" height="40" rx="4" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <!-- axle beams -->
  <line x1="900" y1="90" x2="1050" y2="90" stroke="#0e2433" stroke-width="1.5"/>
  <line x1="900" y1="270" x2="1050" y2="270" stroke="#0e2433" stroke-width="1.5"/>
  <!-- rear cross -->
  <rect x="1080" y="110" width="40" height="140" fill="none" stroke="#0e2433" stroke-width="2"/>
  <text x="70" y="80" fill="#5b6b75" font-size="11" font-family="system-ui">FRENTE</text>
  <text x="1080" y="100" fill="#5b6b75" font-size="11" font-family="system-ui">TRASERA</text>
  <text x="450" y="340" fill="#5b6b75" font-size="11" font-family="system-ui">TRAVESAÑOS · VIGA ESTRUCTURAL</text>
</svg>
