<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <rect width="900" height="420" fill="#0e2433"/>
  <text x="24" y="32" fill="#8fd0d8" font-family="system-ui,sans-serif" font-size="14" letter-spacing="2">CHASIS · VISTA SUPERIOR</text>
  <!-- gooseneck left -->
  <rect x="40" y="160" width="90" height="100" rx="6" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2"/>
  <text x="50" y="155" fill="#8fd0d8" font-size="11" font-family="system-ui">CUELLO</text>
  <!-- main frame -->
  <rect x="120" y="140" width="620" height="140" rx="8" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2.5"/>
  <!-- cross members -->
  <line x1="200" y1="140" x2="200" y2="280" stroke="#5b6b75" stroke-width="2"/>
  <line x1="320" y1="140" x2="320" y2="280" stroke="#5b6b75" stroke-width="2"/>
  <line x1="440" y1="140" x2="440" y2="280" stroke="#5b6b75" stroke-width="2"/>
  <line x1="560" y1="140" x2="560" y2="280" stroke="#5b6b75" stroke-width="2"/>
  <line x1="660" y1="140" x2="660" y2="280" stroke="#5b6b75" stroke-width="2"/>
  <!-- landing gear -->
  <rect x="240" y="100" width="40" height="30" rx="3" fill="none" stroke="#8fd0d8" stroke-width="2"/>
  <rect x="240" y="290" width="40" height="30" rx="3" fill="none" stroke="#8fd0d8" stroke-width="2"/>
  <text x="220" y="95" fill="#8fd0d8" font-size="10" font-family="system-ui">PATÍN</text>
  <!-- bogie / axles -->
  <circle cx="620" cy="100" r="36" fill="none" stroke="#8fd0d8" stroke-width="2.5"/>
  <circle cx="620" cy="320" r="36" fill="none" stroke="#8fd0d8" stroke-width="2.5"/>
  <circle cx="700" cy="100" r="36" fill="none" stroke="#8fd0d8" stroke-width="2.5"/>
  <circle cx="700" cy="320" r="36" fill="none" stroke="#8fd0d8" stroke-width="2.5"/>
  <line x1="580" y1="210" x2="740" y2="210" stroke="#8fd0d8" stroke-width="2"/>
  <text x="600" y="80" fill="#8fd0d8" font-size="11" font-family="system-ui">EJES</text>
  <!-- rear bumper -->
  <rect x="750" y="170" width="40" height="80" rx="4" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2"/>
  <text x="755" y="165" fill="#8fd0d8" font-size="10" font-family="system-ui">DEFENSA</text>
  <!-- labels -->
  <text x="130" y="360" fill="#5b6b75" font-size="12" font-family="system-ui">FRENTE</text>
  <text x="700" y="360" fill="#5b6b75" font-size="12" font-family="system-ui">TRASERA</text>
</svg>
