<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <rect width="700" height="480" fill="#ffffff"/>
  <text x="20" y="28" fill="#0e2433" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">CHASIS · VISTA TRASERA / EJES</text>
  <!-- rear frame -->
  <rect x="150" y="50" width="400" height="60" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <!-- plate -->
  <rect x="280" y="62" width="140" height="36" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <!-- lights -->
  <circle cx="180" cy="80" r="14" fill="none" stroke="#0e2433" stroke-width="2"/>
  <circle cx="520" cy="80" r="14" fill="none" stroke="#0e2433" stroke-width="2"/>
  <!-- bumper -->
  <rect x="170" y="120" width="360" height="30" fill="none" stroke="#0e2433" stroke-width="2"/>
  <!-- mud flaps -->
  <rect x="180" y="160" width="45" height="70" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <rect x="475" y="160" width="45" height="70" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <!-- dual wheels left assembly -->
  <rect x="120" y="280" width="200" height="50" fill="none" stroke="#0e2433" stroke-width="2"/>
  <rect x="140" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="185" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="230" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="275" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <!-- dual wheels right assembly -->
  <rect x="380" y="280" width="200" height="50" fill="none" stroke="#0e2433" stroke-width="2"/>
  <rect x="400" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="445" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="490" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="535" y="340" width="35" height="70" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <!-- axle center -->
  <circle cx="220" cy="305" r="12" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <circle cx="480" cy="305" r="12" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <text x="160" y="270" fill="#5b6b75" font-size="12" font-family="system-ui">EJE DELANTERO BOGIE</text>
  <text x="420" y="270" fill="#5b6b75" font-size="12" font-family="system-ui">EJE TRASERO BOGIE</text>
  <text x="300" y="55" fill="#5b6b75" font-size="11" font-family="system-ui">PLACA · CALAVERAS · DEFENSA</text>
</svg>
