<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0e2433"/>
  <text x="24" y="36" fill="#8fd0d8" font-family="system-ui,sans-serif" font-size="14" letter-spacing="2">CHASIS · VISTA FRONTAL</text>
  <!-- gooseneck / head -->
  <rect x="280" y="80" width="240" height="60" rx="8" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2"/>
  <rect x="300" y="100" width="80" height="30" rx="4" fill="#0e2433" stroke="#5b6b75" stroke-width="1.5"/>
  <text x="310" y="120" fill="#8fd0d8" font-size="11" font-family="system-ui">CABEZAL</text>
  <!-- air gladhands -->
  <circle cx="340" cy="160" r="14" fill="#b54a3a" stroke="#f3f1ec" stroke-width="1.5"/>
  <circle cx="380" cy="160" r="14" fill="#b54a3a" stroke="#f3f1ec" stroke-width="1.5"/>
  <text x="320" y="190" fill="#f3f1ec" font-size="11" font-family="system-ui">MANITAS DE AIRE</text>
  <!-- light connector -->
  <rect x="420" y="148" width="50" height="24" rx="3" fill="#1f8a96" stroke="#8fd0d8" stroke-width="1.5"/>
  <text x="425" y="190" fill="#f3f1ec" font-size="11" font-family="system-ui">CONEX. LUZ</text>
  <!-- frame front -->
  <rect x="200" y="200" width="400" height="100" rx="6" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2.5"/>
  <!-- landing gear legs -->
  <rect x="250" y="300" width="28" height="90" rx="3" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2"/>
  <rect x="522" y="300" width="28" height="90" rx="3" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2"/>
  <rect x="240" y="385" width="48" height="12" rx="2" fill="#5b6b75"/>
  <rect x="512" y="385" width="48" height="12" rx="2" fill="#5b6b75"/>
  <text x="230" y="420" fill="#8fd0d8" font-size="12" font-family="system-ui">PATÍN IZQ.</text>
  <text x="505" y="420" fill="#8fd0d8" font-size="12" font-family="system-ui">PATÍN DER.</text>
  <!-- locks -->
  <rect x="220" y="220" width="30" height="20" rx="2" fill="#b54a3a" stroke="#f3f1ec" stroke-width="1"/>
  <rect x="550" y="220" width="30" height="20" rx="2" fill="#b54a3a" stroke="#f3f1ec" stroke-width="1"/>
  <text x="200" y="260" fill="#f3f1ec" font-size="10" font-family="system-ui">SEGURO IZQ</text>
  <text x="530" y="260" fill="#f3f1ec" font-size="10" font-family="system-ui">SEGURO DER</text>
  <!-- cross members -->
  <line x1="220" y1="250" x2="580" y2="250" stroke="#5b6b75" stroke-width="2"/>
  <text x="340" y="245" fill="#8fd0d8" font-size="11" font-family="system-ui">TRAVESAÑOS</text>
</svg>
