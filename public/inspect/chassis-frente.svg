<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <rect width="600" height="420" fill="#ffffff"/>
  <text x="20" y="28" fill="#0e2433" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">CHASIS · VISTA FRONTAL</text>
  <!-- gooseneck head -->
  <rect x="180" y="50" width="240" height="50" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <rect x="220" y="60" width="70" height="30" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <!-- gladhands -->
  <circle cx="260" cy="130" r="16" fill="none" stroke="#0e2433" stroke-width="2"/>
  <circle cx="300" cy="130" r="16" fill="none" stroke="#0e2433" stroke-width="2"/>
  <rect x="330" y="118" width="40" height="24" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <!-- frame -->
  <rect x="120" y="160" width="360" height="70" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <line x1="140" y1="195" x2="460" y2="195" stroke="#0e2433" stroke-width="1.5"/>
  <!-- locks -->
  <rect x="140" y="175" width="28" height="18" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <rect x="432" y="175" width="28" height="18" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <!-- landing gear legs -->
  <rect x="180" y="230" width="24" height="100" fill="none" stroke="#0e2433" stroke-width="2"/>
  <rect x="396" y="230" width="24" height="100" fill="none" stroke="#0e2433" stroke-width="2"/>
  <rect x="165" y="325" width="54" height="14" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <rect x="381" y="325" width="54" height="14" fill="none" stroke="#0e2433" stroke-width="1.8"/>
  <text x="155" y="360" fill="#5b6b75" font-size="12" font-family="system-ui">PATÍN IZQ.</text>
  <text x="375" y="360" fill="#5b6b75" font-size="12" font-family="system-ui">PATÍN DER.</text>
  <text x="230" y="115" fill="#5b6b75" font-size="11" font-family="system-ui">MANITAS · CONEXIÓN LUZ</text>
  <text x="220" y="45" fill="#5b6b75" font-size="11" font-family="system-ui">CABEZAL</text>
</svg>
