<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <rect width="1000" height="360" fill="#0e2433"/>
  <text x="24" y="32" fill="#8fd0d8" font-family="system-ui,sans-serif" font-size="14" letter-spacing="2">CHASIS · ELEVACIÓN LATERAL</text>
  <!-- longitudinal beam -->
  <rect x="60" y="140" width="780" height="36" rx="4" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2.5"/>
  <!-- gooseneck -->
  <path d="M60 158 L60 100 L140 100 L160 158" fill="none" stroke="#8fd0d8" stroke-width="3"/>
  <rect x="70" y="110" width="50" height="28" rx="3" fill="#1f8a96" opacity="0.5" stroke="#8fd0d8" stroke-width="1.5"/>
  <text x="72" y="95" fill="#8fd0d8" font-size="11" font-family="system-ui">CABEZAL</text>
  <!-- landing gear -->
  <line x1="280" y1="176" x2="280" y2="260" stroke="#8fd0d8" stroke-width="3"/>
  <line x1="260" y1="260" x2="300" y2="260" stroke="#8fd0d8" stroke-width="3"/>
  <text x="250" y="280" fill="#8fd0d8" font-size="11" font-family="system-ui">PATÍN</text>
  <!-- wheels front axle of bogie -->
  <circle cx="620" cy="250" r="42" fill="#0e2433" stroke="#8fd0d8" stroke-width="3"/>
  <circle cx="620" cy="250" r="18" fill="#1a3a4a" stroke="#5b6b75" stroke-width="2"/>
  <!-- wheels rear axle -->
  <circle cx="740" cy="250" r="42" fill="#0e2433" stroke="#8fd0d8" stroke-width="3"/>
  <circle cx="740" cy="250" r="18" fill="#1a3a4a" stroke="#5b6b75" stroke-width="2"/>
  <!-- axle line -->
  <line x1="570" y1="250" x2="790" y2="250" stroke="#5b6b75" stroke-width="2"/>
  <text x="640" y="200" fill="#8fd0d8" font-size="12" font-family="system-ui">CARRO DE EJES</text>
  <!-- springs hint -->
  <path d="M600 200 Q610 185 620 200 Q630 215 640 200" fill="none" stroke="#1f8a96" stroke-width="2"/>
  <text x="580" y="175" fill="#8fd0d8" font-size="10" font-family="system-ui">MUELLES</text>
  <!-- rear bumper / plate -->
  <rect x="850" y="150" width="50" height="50" rx="3" fill="#1a3a4a" stroke="#8fd0d8" stroke-width="2"/>
  <text x="855" y="140" fill="#8fd0d8" font-size="10" font-family="system-ui">PLACA</text>
  <!-- hose system -->
  <path d="M160 158 Q300 120 450 158" fill="none" stroke="#b54a3a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="115" fill="#b54a3a" font-size="10" font-family="system-ui">MANGUERAS</text>
  <text x="80" y="330" fill="#5b6b75" font-size="12" font-family="system-ui">FRENTE</text>
  <text x="820" y="330" fill="#5b6b75" font-size="12" font-family="system-ui">TRASERA</text>
</svg>
