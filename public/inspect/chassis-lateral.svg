<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 320" width="1240" height="320">
  <rect width="1240" height="320" fill="#ffffff"/>
  <text x="20" y="28" fill="#0e2433" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">CHASIS · ELEVACIÓN LATERAL</text>
  <!-- main beam -->
  <rect x="80" y="120" width="1000" height="28" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <!-- gooseneck -->
  <path d="M80 134 L80 70 L200 70 L280 134" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <line x1="80" y1="70" x2="280" y2="70" stroke="#0e2433" stroke-width="2"/>
  <!-- landing gear -->
  <line x1="340" y1="148" x2="340" y2="230" stroke="#0e2433" stroke-width="2"/>
  <line x1="320" y1="230" x2="360" y2="230" stroke="#0e2433" stroke-width="2"/>
  <path d="M340 200 L355 215" stroke="#0e2433" stroke-width="1.5"/>
  <!-- ground -->
  <line x1="300" y1="250" x2="420" y2="250" stroke="#5b6b75" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="900" y1="250" x2="1120" y2="250" stroke="#5b6b75" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- wheels -->
  <circle cx="960" cy="210" r="55" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <circle cx="960" cy="210" r="22" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <circle cx="1080" cy="210" r="55" fill="none" stroke="#0e2433" stroke-width="2.2"/>
  <circle cx="1080" cy="210" r="22" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <!-- axle -->
  <line x1="900" y1="210" x2="1140" y2="210" stroke="#0e2433" stroke-width="1.5"/>
  <!-- rear bumper -->
  <rect x="1140" y="130" width="20" height="50" fill="none" stroke="#0e2433" stroke-width="2"/>
  <!-- kingpin hint -->
  <circle cx="160" cy="134" r="6" fill="none" stroke="#0e2433" stroke-width="1.5"/>
  <!-- dim lines style -->
  <text x="500" y="100" fill="#5b6b75" font-size="11" font-family="system-ui">VIGA LONGITUDINAL</text>
  <text x="150" y="55" fill="#5b6b75" font-size="11" font-family="system-ui">CUELLO DE GANSO</text>
  <text x="310" y="275" fill="#5b6b75" font-size="11" font-family="system-ui">PATÍN</text>
  <text x="990" y="290" fill="#5b6b75" font-size="11" font-family="system-ui">CARRO DE EJES</text>
</svg>
