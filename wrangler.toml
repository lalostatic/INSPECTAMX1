# Punto de entrada que Cloudflare busca en la raíz.
# La fuente de verdad es cloudflare/wrangler.toml.
name = "inspectamx"
main = "cloudflare/workers/api/src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "./pages/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[vars]
VITE_AUTH_ENABLED = "true"
BETTER_AUTH_URL = "https://inspectamx.com"
