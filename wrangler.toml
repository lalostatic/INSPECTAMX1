# Fuente de verdad: cloudflare/wrangler.toml
name = "inspectamx"
main = "cloudflare/workers/api/src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "./pages/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[vars]
VITE_AUTH_ENABLED = "true"
BETTER_AUTH_URL = "https://inspectamx.com"

[[d1_databases]]
binding = "DB"
database_name = "inspectamx-db"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "inspectamx-photos"

[triggers]
crons = ["0 6 * * *"]
