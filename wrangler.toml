# INSPECTAMX — Cloudflare
#
# Este archivo reexporta el Worker de SITIO (apps/worker):
# folleto estático vía binding ASSETS. No corre pg ni Better Auth.
#
# Patio (login, /chasis, Postgres): origin Node. Ver docs/DEPLOY.md.
# Deploy del sitio: npm run deploy:site

name = "inspectamx"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

[assets]
directory = "./docs"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[vars]
VITE_AUTH_ENABLED = "true"
BETTER_AUTH_URL = "https://inspectamx.com"
